apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kuma
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: kuma-https
  hostnames:
    - uptime.lucas.tools
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kuma-service
          port: 3001
