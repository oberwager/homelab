# Referenced by spec.ingressClassName on every Ingress. Already exists in the
# cluster (created from the upstream ingress-nginx manifest); kept here so a
# rebuilt cluster has it too.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
spec:
  controller: k8s.io/ingress-nginx
