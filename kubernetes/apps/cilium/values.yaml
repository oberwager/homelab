# https://www.talos.dev/latest/kubernetes-guides/network/deploying-cilium/
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost # KubePrism
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
l2announcements:
  enabled: true
operator:
  replicas: 1
  prometheus:
    enabled: true
hubble:
  tls:
    auto:
      method: cronJob # helm-generated certs would change every render
prometheus:
  enabled: true
