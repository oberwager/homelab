name: Deploy

# PRs: validate, then show `kubectl diff` as a PR comment.
# main: validate, then apply. A manual run only deploys when started on main.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # Never cancel an apply mid-flight; PR diffs are disposable.
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'cluster' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/validate.yml

  diff:
    needs: validate
    # Fork PRs get no secrets and no OIDC token, so they can't reach the cluster.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/cluster
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          k8s-url: ${{ secrets.K8S_URL }}
          k8s-token: ${{ secrets.INFRA_K8S_SA_TOKEN }}

      # kubectl diff exits 0 for no changes, 1 for changes, >1 for errors. Record the
      # code instead of failing here, so the comment step can say why a diff failed.
      - name: Diff against the cluster
        id: diff
        env:
          # Hides last-applied/generation bookkeeping and Secrets from the output.
          KUBECTL_EXTERNAL_DIFF: ${{ github.workspace }}/.github/scripts/kdiff
        run: |
          set +e
          kubectl diff -k kubernetes/ --server-side --force-conflicts > diff.txt 2> diff.err
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Comment the diff on the PR
        if: steps.diff.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.diff.outputs.code }}
        run: |
          {
            echo "<!-- cluster-diff -->"
            echo "### Cluster diff"
            .github/scripts/diff-body.sh diff.txt diff.err "$CODE"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none

      - name: Fail if the diff errored
        if: steps.diff.outputs.code != '0' && steps.diff.outputs.code != '1'
        run: |
          grep -v '^Warning:' diff.err || true
          exit 1

  deploy:
    needs: validate
    # Pushes to main, or a manual run started on main. Never an unmerged branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/cluster
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          k8s-url: ${{ secrets.K8S_URL }}
          k8s-token: ${{ secrets.INFRA_K8S_SA_TOKEN }}

      # Server-side: the CNPG and cert-manager CRDs exceed the 256 KiB
      # last-applied annotation that client-side apply needs.
      - name: Apply
        run: kubectl apply -k kubernetes/ --server-side --force-conflicts

      # `kubectl apply` returns once the objects are accepted. A rollout can still
      # stall afterwards (admission denied, image pull error, crash loop) while the
      # old pods keep serving, so wait for every workload this repo manages and fail
      # the run if one doesn't finish. yq and jq are preinstalled on ubuntu-latest.
      - name: Wait for rollouts
        run: |
          kubectl kustomize kubernetes/ \
            | yq -N -r 'select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet")
                     | .kind + "/" + .metadata.name + " " + (.metadata.namespace // "default")' \
            | grep -E '^(Deployment|StatefulSet|DaemonSet)/' | sort -u > workloads.txt
          echo "Waiting for $(wc -l < workloads.txt | tr -d ' ') workloads"

          rollout() {
            for attempt in 1 2 3; do
              if kubectl -n "$2" rollout status "$1" --timeout=300s; then return 0; fi
              # If the API server answers, the rollout really is stuck. If not (for
              # example the tailnet is reconnecting), wait and look again.
              if kubectl get --raw /readyz > /dev/null 2>&1; then return 1; fi
              echo "API server unreachable, retrying ($attempt/3)"
              sleep 20
            done
            return 1
          }

          failed=0
          while read -r res ns; do
            rollout "$res" "$ns" || { echo "::error::$res in $ns did not finish rolling out"; failed=1; }
          done < workloads.txt
          exit "$failed"
